              "required": ["kind", "iteration_path", "person", "work_item_id", "text", "work_item_type",
              "state", "unplanned"], "type": "object", "additionalProperties": false}}, "description":
              "One answer of the Product Owner app in Dify (or Foundry).\n\nAt most one of draft (new
              story), query (read) or change (update an\nexisting story) is filled per turn.", "properties":
              {"message": {"type": "string"}, "stage": {"enum": ["clarifying", "draft_ready", "answer",
              "change_ready"], "type": "string"}, "draft": {"anyOf": [{"$ref": "#/$defs/StoryDraftContent"},
              {"type": "null"}]}, "query": {"anyOf": [{"$ref": "#/$defs/WorkItemQuery"}, {"type": "null"}]},
