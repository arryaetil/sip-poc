app:
  description: Generated by sip-poc/dify/build_apps.py. Returns BusinessContext JSON.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: SIP — Business Context Finalizer (Dify)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.0.5@51583313a5988d5dca405063831ffeeacdc1f2e95f32a8c10b4c281ceef39ebb
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-source-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: llm-source-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: Start
        type: start
        variables:
        - label: history
          max_length: 100000
          options: []
          required: false
          type: paragraph
          variable: history
      height: 90
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Finalizer
        type: llm
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            reasoning_effort: medium
            response_format: json_schema
            json_schema: '{"name": "BusinessContext", "strict": true, "schema": {"properties": {"name":
              {"type": "string"}, "offering_type": {"enum": ["product", "service"], "type": "string"},
              "short_summary": {"type": "string"}, "customer_problems_addressed": {"items": {"type": "string"},
              "type": "array"}, "core_capabilities": {"items": {"type": "string"}, "type": "array"}, "target_organisations":
              {"items": {"type": "string"}, "type": "array"}, "relevant_industries": {"items": {"type":
              "string"}, "type": "array"}, "relevant_roles_and_decision_makers": {"items": {"type": "string"},
              "type": "array"}, "geographic_focus": {"items": {"type": "string"}, "type": "array"}, "value_proposition":
              {"type": "string"}, "differentiators": {"items": {"type": "string"}, "type": "array"}, "people":
              {"items": {"type": "string"}, "type": "array"}, "supporting_evidence_or_knowledge_sources":
              {"items": {"type": "string"}, "type": "array"}, "key_marketing_messages": {"items": {"type":
              "string"}, "type": "array"}, "assumptions": {"items": {"type": "string"}, "type": "array"},
              "open_questions": {"items": {"type": "string"}, "type": "array"}}, "required": ["name",
              "offering_type", "short_summary", "customer_problems_addressed", "core_capabilities", "target_organisations",
              "relevant_industries", "relevant_roles_and_decision_makers", "geographic_focus", "value_proposition",
              "differentiators", "people", "supporting_evidence_or_knowledge_sources", "key_marketing_messages",
              "assumptions", "open_questions"], "type": "object", "additionalProperties": false}}'
          mode: chat
          name: gpt-5.6-terra
          provider: langgenius/openai/openai
        prompt_template:
        - id: llm-system
          role: system
          text: 'You convert the Product Strategist conversation into one structured Business Context.


            Use only information established in the conversation. Do not invent capabilities, customers,
            integrations, evidence, results, statistics or commercial claims.


            Preserve the user''s intended meaning while improving clarity. Use an empty string or empty
            list where information is missing. Add important missing information to open_questions. Keep
            assumptions separate from confirmed information.


            The result is a working record for Product Owner review. It is not approved until the user
            explicitly chooses to approve and save it in the application.'
        - id: llm-user
          role: user
          text: 'Conversation so far (may be empty):

            <history>

            {{#start.history#}}

            </history>


            Latest user message:

            {{#sys.query#}}'
        vision:
          enabled: false
      height: 90
      id: llm
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Answer
        type: answer
        answer: '{{#llm.text#}}'
        variables: []
      height: 90
      id: answer
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
  rag_pipeline_variables: []
