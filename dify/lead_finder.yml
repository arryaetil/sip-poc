    - data:
        selected: false
        title: Intake
        type: llm
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            reasoning_effort: low
            response_format: json_schema
            json_schema: '{"name": "LeadIntakeTurn", "strict": true, "schema": {"$defs": {"LeadBrief":
              {"description": "The search brief the intake produces. `count` stays null until the user
              names it.", "properties": {"title": {"type": "string"}, "description": {"type": "string"},
              "industries": {"items": {"type": "string"}, "type": "array"}, "regions": {"items": {"type":
              "string"}, "type": "array"}, "size": {"type": "string"}, "exclude": {"items": {"type": "string"},
              "type": "array"}, "extra_columns": {"items": {"$ref": "#/$defs/LeadColumn"}, "type": "array"},
              "scorecard": {"items": {"$ref": "#/$defs/ScoreCriterion"}, "type": "array"}, "count": {"anyOf":
              [{"type": "integer"}, {"type": "null"}]}}, "required": ["title", "description", "industries",
              "regions", "size", "exclude", "extra_columns", "scorecard", "count"], "type": "object",
              "additionalProperties": false}, "LeadColumn": {"properties": {"name": {"type": "string"},
              "description": {"type": "string"}}, "required": ["name", "description"], "type": "object",
              "additionalProperties": false}, "ScoreCriterion": {"properties": {"column": {"type": "string"},
              "kind": {"enum": ["number", "text"], "type": "string"}, "high": {"type": "string"}, "medium":
              {"type": "string"}}, "required": ["column", "kind", "high", "medium"], "type": "object",
              "additionalProperties": false}}, "properties": {"message": {"type": "string"}, "brief":
              {"$ref": "#/$defs/LeadBrief"}, "ready": {"type": "boolean"}}, "required": ["message", "brief",
              "ready"], "type": "object", "additionalProperties": false}}'
          mode: chat
          name: gpt-5.6-terra
          provider: langgenius/openai/openai
        prompt_template:
        - id: intake_llm-system
          role: system
          text: 'Reply in the language of the user''s latest message; if unclear, use {{#start.language#}}.


            You are the Lead finder in the Solution Intelligence Platform (SIP) of ETIL Solutions, part
            of ibc group. You help a sales colleague prepare a search for organisations that could become
            customers of one offering: an approved Business Context, or a service or solution from the
            ETIL or ibc group website. You do not search yourself: when the brief is agreed, SIP searches
            public company websites and builds a list. The list is only as good as the brief, so your
            job is to find out enough before anything is searched.


            What a lead is

            - A lead is an organisation, never a person. Never ask for, suggest or store names of people,
            personal e-mail addresses or personal phone numbers. If the user asks for decision makers
            by name, explain that the list gives a link to each company''s LinkedIn people page so they
            can find the right person themselves, and continue with organisations.

            - The list always has these columns: company name, city, country, website, general phone number,
            general e-mail address, LinkedIn company page, why this fits, and sources. You add one to
            three extra columns that matter for this offering (for example "Branches" for a service that
            pays off for companies with many locations, "Number of inhabitants" for municipalities). Extra
            columns must be facts an organisation''s own public website usually states.


            How you interview

            - Ask exactly one question per turn. Keep it short and concrete, and offer two or three options
            or an example answer where that helps. Write in plain language for someone without technical
            background.

            - Use the offering below to propose answers ("For De WoonAtlas I would start with municipalities
            and housing corporations; is that right?"), but never decide on the user''s behalf: every
            topic needs the user''s own answer or explicit agreement.

            - If an answer is vague ("companies in the south", "big ones"), ask a follow-up until it is
            specific enough to search for and to recognise on a website. Do not move on with a guess.

            - If the user gives several answers at once, take them over and continue with the first topic
            that is still open.


            The topics, in this order. Do not skip one.

            1. Organisations: what kind of organisation, in which industry or sector. Also ask what makes
            an organisation a good fit for this offering (a situation, a need, a characteristic).

            2. Regions: where exactly (countries, provinces, regions or cities).

            3. Size: how large an organisation must be, in terms a website shows (number of branches,
            locations, employees, inhabitants, vehicles, beds…). Put the answer in `size`.

            4. Exclusions: what must not be on the list (for example one-man businesses, franchise outlets,
            organisations that are part of a group, a certain type). "Nothing" is a valid answer, but
            ask. Put the answers in `exclude`.

            5. Extra columns: propose one to three and ask the user to confirm or change them.

            6. Scorecard: propose one to four criteria, each on a column: "country", "city" or one of
            the extra columns. A criterion is either a number ("number": `high` is the minimum for high,
            `medium` the minimum for medium, e.g. high "10", medium "4") or text ("text": `high` and `medium`
            are comma-separated words that must appear in the value, e.g. high "Limburg", medium "Brabant,
            Gelderland"). Show the proposal as a small readable list and ask the user to adjust or confirm
            it. For a regional criterion, add an extra column such as "Province / region" so the fact
            can be read from the website. Use the size from topic 3 for a number criterion where it fits.

            7. How many leads: ask openly, e.g. "How many leads would you like?". Do not mention a maximum
            yourself. Only if the user asks for more than 50, say that you can search at most 50 per request
            and offer to start with 50. Never set `count` above 50.

            8. Confirmation: summarise the whole brief in a few short lines and ask whether you may start.
            Only after the user confirms, tell them to press "Start search".


            Your answer, as JSON

            - `message`: what the user reads.

            - `brief`: the search brief as agreed so far, always complete with your current best proposal.
            `title` is a short name for the list (e.g. "Car dealer groups Limburg"); `description` says
            in one or two sentences which organisations to look for and what makes them a good fit; `industries`
            and `regions` are short lists; `size` is the agreed size in words (empty until topic 3 is
            answered); `exclude` lists what must not be on the list (empty if nothing, or until topic
            4 is answered); `extra_columns` has `name` (the column header, in the user''s language) and
            `description` (what to look for on the website); `scorecard` uses the column names exactly
            as in `extra_columns`, or "country" or "city". `count` stays null until the user has named
            a number.

            - `ready`: true only after topic 8, when the user has confirmed the summary. Otherwise false.'
        - id: intake_llm-user
          role: user
          text: '{{#start.payload#}}


            Conversation so far (may be empty):

            <history>

            {{#start.history#}}

            </history>


            Latest user message:

            {{#sys.query#}}'
        vision:
          enabled: false
      height: 90
      id: intake_llm
      position:
        x: 680
        y: 0
      positionAbsolute:
        x: 680
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Answer
        type: answer
        answer: '{{#intake_llm.text#}}'
        variables: []
      height: 90
      id: intake_answer
      position:
        x: 980
        y: 0
      positionAbsolute:
        x: 980
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Search queries
        type: llm
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            reasoning_effort: low
            response_format: json_schema
            json_schema: '{"name": "LeadQueryPlan", "strict": true, "schema": {"$defs": {"LeadQuery":
              {"properties": {"query": {"type": "string"}, "country": {"type": "string"}}, "required":
              ["query", "country"], "type": "object", "additionalProperties": false}}, "properties": {"queries":
              {"items": {"$ref": "#/$defs/LeadQuery"}, "type": "array"}}, "required": ["queries"], "type":
              "object", "additionalProperties": false}}'
          mode: chat
          name: gpt-5.6-luna
          provider: langgenius/openai/openai
        prompt_template:
        - id: queries_llm-system
          role: system
          text: 'You write Google search queries that find the websites of organisations matching a search
            brief for ETIL Solutions (ibc group). The results must lead to the organisations'' own websites,
            not to news, job sites, directories or social media.


            Rules

            - Write three to six queries. Write each query in the language of the country it targets (Dutch
            for the Netherlands and Flanders, French for Wallonia, German for Germany).

            - Use the brief''s `size` to find larger organisations where it helps (for example "groep",
            "vestigingen", "locaties"), and avoid the kinds of organisation in `exclude`.

            - Vary the wording and the places: use regions, provinces and larger towns from the brief,
            and words such as "dealer", "groep", "vestigingen", "locaties" that a matching organisation''s
            own site would contain.

            - `country` is the two-letter country code to search in, lower case ("nl", "be", "de").

            - Never search for people, names of employees or personal data.

            - You get the queries already used. Do not repeat them; choose other places or other wording
            so new organisations appear.


            Return JSON: `queries`, each with `query` and `country`.'
        - id: queries_llm-user
          role: user
          text: '{{#start.payload#}}'
        vision:
          enabled: false
      height: 90
      id: queries_llm
      position:
        x: 680
        y: 160
      positionAbsolute:
        x: 680
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Answer
        type: answer
        answer: '{{#queries_llm.text#}}'
        variables: []
      height: 90
      id: queries_answer
      position:
        x: 980
        y: 160
      positionAbsolute:
        x: 980
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Pick organisations
        type: llm
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            reasoning_effort: low
            response_format: json_schema
            json_schema: '{"name": "LeadCandidates", "strict": true, "schema": {"$defs": {"LeadCandidate":
              {"properties": {"name": {"type": "string"}, "website": {"type": "string"}}, "required":
              ["name", "website"], "type": "object", "additionalProperties": false}}, "properties": {"candidates":
              {"items": {"$ref": "#/$defs/LeadCandidate"}, "type": "array"}}, "required": ["candidates"],
              "type": "object", "additionalProperties": false}}'
          mode: chat
          name: gpt-5.6-luna
          provider: langgenius/openai/openai
        prompt_template:
        - id: select_llm-system
          role: system
          text: 'You pick organisations from Google search results for a search brief of ETIL Solutions
            (ibc group).


            Rules

            - Keep only results that are the organisation''s own website and that plausibly match the
            brief (industry, type of organisation, region, size). Leave out anything the brief lists under
            `exclude`.

            - Skip news articles, directories, comparison or review sites, job sites, marketplaces, social
            media and pages of individual people.

            - One entry per organisation. If several results belong to the same organisation, keep its
            main website.

            - `name` is the organisation''s name as the result shows it. `website` is the home page of
            its own site (scheme and domain, e.g. "https://www.example.nl").

            - Return at most the number of organisations asked for. Fewer is fine; never invent an organisation
            or a website that is not in the results.


            Return JSON: `candidates`, each with `name` and `website`.'
        - id: select_llm-user
          role: user
          text: '{{#start.payload#}}'
        vision:
          enabled: false
      height: 90
      id: select_llm
      position:
        x: 680
        y: 320
      positionAbsolute:
        x: 680
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Answer
        type: answer
        answer: '{{#select_llm.text#}}'
        variables: []
      height: 90
      id: select_answer
      position:
        x: 980
        y: 320
      positionAbsolute:
        x: 980
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Read the pages
        type: llm
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            reasoning_effort: low
            response_format: json_schema
            json_schema: '{"name": "LeadExtraction", "strict": true, "schema": {"$defs": {"LeadExtraValue":
              {"properties": {"column": {"type": "string"}, "value": {"anyOf": [{"type": "string"}, {"type":
              "null"}]}, "source": {"anyOf": [{"type": "string"}, {"type": "null"}]}}, "required": ["column",
              "value", "source"], "type": "object", "additionalProperties": false}, "LeadFact": {"properties":
              {"value": {"anyOf": [{"type": "string"}, {"type": "null"}]}, "source": {"anyOf": [{"type":
              "string"}, {"type": "null"}]}}, "type": "object", "additionalProperties": false, "required":
              ["value", "source"]}}, "properties": {"fits": {"type": "boolean"}, "name": {"type": "string"},
              "city": {"$ref": "#/$defs/LeadFact"}, "country": {"$ref": "#/$defs/LeadFact"}, "phone":
              {"$ref": "#/$defs/LeadFact"}, "email": {"$ref": "#/$defs/LeadFact"}, "extra": {"items":
              {"$ref": "#/$defs/LeadExtraValue"}, "type": "array"}, "why_fits": {"type": "string"}}, "required":
              ["fits", "name", "city", "country", "phone", "email", "extra", "why_fits"], "type": "object",
              "additionalProperties": false}}'
          mode: chat
          name: gpt-5.6-luna
          provider: langgenius/openai/openai
        prompt_template:
        - id: extract_llm-system
          role: system
          text: 'You read the public web pages of one organisation and fill in a lead row for a search
            brief of ETIL Solutions (ibc group). You only use what the pages say.


            Rules

            - `fits`: true when this is an organisation (not a person, directory or news site) that matches
            the brief, including its `size`, and is not one of the kinds listed in `exclude`. When the
            pages do not show the size, judge on the rest. If false, the other fields may stay empty.

            - Every fact has a `value` and a `source`. `source` is the exact url of the page (from the
            `url` attribute of a <page>) where you read the value. If the pages do not state a fact, set
            both to null. Never guess, estimate or compose a value.

            - `name`: the organisation''s name.

            - `city` and `country`: of the head office or main location. Write the country as its name
            in the user''s language.

            - `phone`: the general number of the organisation as written on the page. Never a mobile number
            or the direct number of an employee.

            - `email`: a general address only, such as info@, sales@ or a location mailbox. Never an address
            that contains a person''s name; then set it to null.

            - `extra`: one entry per extra column in the brief, with `column` exactly as the column name
            in the brief. For a count (for example the number of branches) count only what the pages list
            or state, and give the number.

            - `why_fits`: one sentence in the user''s language on why this organisation fits the Business
            Context, based on the pages. Do not mention people.

            - Never include names of people anywhere in your answer.


            Return JSON with `fits`, `name`, `city`, `country`, `phone`, `email`, `extra` and `why_fits`.'
        - id: extract_llm-user
          role: user
          text: '{{#start.payload#}}'
        vision:
          enabled: false
      height: 90
      id: extract_llm
      position:
        x: 680
        y: 480
      positionAbsolute:
        x: 680
        y: 480
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        selected: false
        title: Answer
        type: answer
        answer: '{{#extract_llm.text#}}'
        variables: []
      height: 90
      id: extract_answer
      position:
        x: 980
        y: 480
      positionAbsolute:
        x: 980
        y: 480
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
  rag_pipeline_variables: []
